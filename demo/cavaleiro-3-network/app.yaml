# Cavaleiro 3 — cenario em 3 camadas: frontend -> backend -> payments-db.
#   - frontend: exposto ao mundo; e o pod que o atacante comprometeu.
#   - backend:  a API; e quem legitimamente fala com o banco.
#   - payments-db: o banco (responde um "segredo").
# Regra de ouro: o frontend NUNCA deveria tocar o banco direto. Sem segmentacao,
# ele toca — e e isso que vamos cortar.
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: c3-network
  labels: { tier: frontend }
spec:
  containers:
    - name: frontend
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: c3-network
  labels: { tier: backend }
spec:
  containers:
    - name: backend
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            printf 'HTTP/1.1 200 OK\r\nConnection: close\r\n\r\nbackend respondeu\n' | nc -l -p 8080
          done
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: c3-network
spec:
  selector: { tier: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: payments-db
  namespace: c3-network
  labels: { tier: db }
spec:
  containers:
    - name: db
      image: hashicorp/http-echo:1.0
      imagePullPolicy: IfNotPresent
      args:
        - "-text=TOP SECRET >> saldo=R$ 1.000.000,00 | cartao=4111 1111 1111 1111"
        - "-listen=:8080"
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  namespace: c3-network
spec:
  selector: { tier: db }
  ports: [{ port: 8080, targetPort: 8080 }]
