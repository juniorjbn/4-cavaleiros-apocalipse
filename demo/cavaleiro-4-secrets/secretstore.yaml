# Cavaleiro 4 — defesa (1/2): o SecretStore conecta o External Secrets Operator
# ao Vault. Aqui usamos um token (dev-mode) guardado num Secret "vault-token".
# Em producao, troque por Kubernetes auth / AppRole / Workload Identity — nada
# de token estatico.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: c4-secrets
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"            # KV v2 montado em /secret
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
