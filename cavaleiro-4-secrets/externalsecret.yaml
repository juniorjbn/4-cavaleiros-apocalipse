# Cavaleiro 4 — defesa (2/2): o ExternalSecret puxa a senha do banco do Vault e
# a materializa como um Secret gerenciado (db-credentials-managed). O valor
# NUNCA aparece em manifest/git — vive no Vault e e sincronizado sob demanda,
# com rotacao automatica a cada refreshInterval. E a credencial que o backend
# (Cavaleiro 3) consome para acessar o payments-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials-eso
  namespace: c4-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: db-credentials-managed
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: db                  # caminho no Vault: secret/db
        property: password
