# Cavaleiro 4 — defesa (2/2): o ExternalSecret puxa o segredo do Vault e o
# materializa como um Secret gerenciado (payments-api-managed). O valor NUNCA
# aparece em manifest/git — vive no Vault e e sincronizado sob demanda, com
# rotacao automatica a cada refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-api-eso
  namespace: c4-secrets
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: payments-api-managed
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: payments          # caminho no Vault: secret/payments
        property: api-key
