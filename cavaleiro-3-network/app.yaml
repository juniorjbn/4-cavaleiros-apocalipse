# Cavaleiro 3 — o cenario. Dois pods no mesmo namespace:
#   - payments-db: um servico interno "sensivel" (responde um segredo).
#   - frontend:    o pod "comprometido" pelo atacante.
# Sem NetworkPolicy, qualquer pod fala com qualquer pod (LAN dos anos 90).
apiVersion: v1
kind: Pod
metadata:
  name: payments-db
  namespace: c3-network
  labels: { app: payments-db }
spec:
  containers:
    - name: db
      image: hashicorp/http-echo:1.0
      imagePullPolicy: IfNotPresent
      args:
        - "-text=TOP SECRET >> saldo=R$ 1.000.000,00 | cartao=4111 1111 1111 1111"
        - "-listen=:8080"
      ports:
        - { containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  namespace: c3-network
spec:
  selector: { app: payments-db }
  ports:
    - { port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: c3-network
  labels: { app: frontend }
spec:
  containers:
    - name: frontend
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
