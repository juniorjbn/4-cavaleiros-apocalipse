# Cavaleiro 2 — "Executar". Um container privilegiado que monta o filesystem
# INTEIRO do node em /host. Benigno: a demo apenas LE arquivos do host para
# provar a fuga do container. Nao escreve, nao altera, nao destroi nada.
apiVersion: v1
kind: Pod
metadata:
  name: fuga-do-container
  namespace: c2-privileged
  labels: { demo: cavaleiro-2 }
spec:
  containers:
    - name: invasor
      image: alpine:3.20
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep infinity"]
      securityContext:
        privileged: true          # <-- a porta escancarada: root no host
      volumeMounts:
        - name: host-root
          mountPath: /host        # <-- o filesystem do node, dentro do pod
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
